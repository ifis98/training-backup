# Per-function settings.
#
# verify_jwt = false:
#   These functions are invoked from the browser via the Supabase JS client,
#   which authenticates with the new `sb_publishable_*` key format. That key
#   is NOT a JWT, so the edge runtime's default JWT verifier rejects it with
#   401 UNAUTHORIZED_INVALID_JWT_FORMAT before the function even runs.
#
#   Auth is still enforced inside each function: every one of these reads
#   `requesterClerkId` from the body and checks `user_roles` for the
#   bytesense_admin role before doing anything.

[functions.invite-admin]
verify_jwt = false

[functions.remove-admin]
verify_jwt = false

[functions.cancel-admin-invite]
verify_jwt = false

[functions.claim-admin-invite]
